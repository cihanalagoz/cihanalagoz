name: Skyline

on:
  schedule:
    - cron: "45 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  skyline:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Generate STL
        run: |
          gh extension install github/gh-skyline --pin v0.1.9
          mkdir -p dist
          gh skyline --user "${{ github.repository_owner }}" --year "$(date +%Y)" --output dist/skyline.stl
      - uses: crazy-max/ghaction-github-pages@v5.0.0
        with:
          target_branch: skyline
          build_dir: dist
          keep_history: false
          jekyll: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
